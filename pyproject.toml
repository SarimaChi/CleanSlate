[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "curate-eval"
version = "0.1.0"
description = "A reproducible instruction-data curation and ablation pipeline."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "polars>=0.20",
  "langid>=1.1.6",
]

[project.optional-dependencies]
train = ["datasets>=2.18", "transformers>=4.40", "peft>=0.10", "accelerate>=0.29", "torch>=2.2"]
eval = ["sacrebleu>=2.4", "rouge-score>=0.1.2", "transformers>=4.40", "peft>=0.10", "torch>=2.2"]
harness = ["lm_eval>=0.4.4"]
toxicity = ["detoxify>=0.5"]
test = ["pytest>=8.0"]
all = ["datasets>=2.18", "transformers>=4.40", "peft>=0.10", "accelerate>=0.29", "torch>=2.2", "sacrebleu>=2.4", "rouge-score>=0.1.2", "lm_eval>=0.4.4", "detoxify>=0.5", "pytest>=8.0"]

[project.scripts]
curate-eval = "curate_eval.cli:main"
curate-eval-judge-labels = "curate_eval.judge_validation:main"
curate-eval-synthesize = "curate_eval.synthetic:main"
curate-eval-train = "curate_eval.train:main"
curate-eval-score = "curate_eval.evaluate:main"
curate-eval-ablate = "curate_eval.ablation:main"
curate-eval-publish = "curate_eval.publish:main"
curate-eval-stackexchange = "curate_eval.stackexchange:main"
curate-eval-wikipedia = "curate_eval.wikipedia:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
