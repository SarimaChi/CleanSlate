task: curate_eval
dataset_path: json
dataset_kwargs:
  data_files:
    test: data/test.jsonl
test_split: test
output_type: generate_until
doc_to_text: "### Instruction:\n{{instruction}}\n{% if input %}Context: {{input}}\n{% endif %}\n\n### Response:\n"
doc_to_target: "{{output}}"
generation_kwargs:
  max_gen_toks: 256
  do_sample: false
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
